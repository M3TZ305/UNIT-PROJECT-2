<form class="save-form" method="post" action="{% url 'main:toggle_saved' slug=city.slug %}" data-city="{{ city.slug }}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button class="save-button {% if city.slug in saved_slugs %}is-saved{% endif %}" type="submit" aria-pressed="{% if city.slug in saved_slugs %}true{% else %}false{% endif %}"><span class="save-symbol" aria-hidden="true">{% if city.slug in saved_slugs %}◆{% else %}◇{% endif %}</span><span class="save-label">{% if city.slug in saved_slugs %}محفوظة{% else %}احفظ الحكاية{% endif %}</span></button></form>
