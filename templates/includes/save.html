<form class="save-form" method="post" action="{{ city.get_save_url }}" data-city="{{ city.saved_key }}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button class="save-button {% if city.saved_key in saved_slugs %}is-saved{% endif %}" type="submit" aria-pressed="{% if city.saved_key in saved_slugs %}true{% else %}false{% endif %}"><span class="save-symbol" aria-hidden="true">{% if city.saved_key in saved_slugs %}◆{% else %}◇{% endif %}</span><span class="save-label">{% if city.saved_key in saved_slugs %}محفوظة{% else %}احفظ الحكاية{% endif %}</span></button></form>
